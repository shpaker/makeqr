[project]
name = "makeqr"
version = "5.0.0"
description = "Generate QR codes for links, WiFi networks, geo points, e-mail, SMS and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Aleksandr Shpak", email = "shpaker@gmail.com" },
]
keywords = ["qr", "qrcode", "cli", "wifi", "vcard", "mecard", "event", "otp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pydantic[email]>=2.0",
  "qrcode[pil]>=8.0",
]

[project.urls]
Homepage = "https://github.com/shpaker/makeqr"
Repository = "https://github.com/shpaker/makeqr"
Changelog = "https://github.com/shpaker/makeqr/blob/main/CHANGELOG.md"
Issues = "https://github.com/shpaker/makeqr/issues"

[project.scripts]
makeqr = "makeqr.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repository root.
module-root = ""

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.14",
  "ty>=0.0.73",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=makeqr --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["makeqr"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ty.src]
include = ["makeqr", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
  "PLR0913",  # Too many arguments to function call
  "PLR0917",  # Too many positional arguments -- click passes options positionally
]
mccabe.max-complexity = 20
flake8-tidy-imports.ban-relative-imports = "all"
select = [
  "F", # Pyflakes
  # "E/W", # pycodestyle
  "C90", # mccabe
  "I", # isort
  # "N", # pep8-naming
  # "D", # pydocstyle
  "UP", # pyupgrade
  "YTT", # flake8-2020
  # "ANN", # flake8-annotations
  # "ASYNC", # flake8-async
  # "S", # flake8-bandit
  # "BLE", # flake8-blind-except
  # "FBT", # flake8-boolean-trap
  "B", # flake8-bugbear
  # "A", # flake8-builtins
  # "COM", # flake8-commas
  # "CPY", # flake8-copyright
  "C4", # flake8-comprehensions
  # "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  # "DJ", # flake8-django
  # "EM", # flake8-errmsg
  "EXE", # flake8-executable
  # "FA", # flake8-future-annotations
  # "ISC", # flake8-implicit-str-concat -- conflicts with the formatter
  # "ICN", # flake8-import-conventions
  "G", # flake8-logging-format
  "INP", # flake8-no-pep420
  # "PIE", # flake8-pie
  "T20", # flake8-print
  # "PYI", # flake8-pyi
  # "PT", # flake8-pytest-style
  # "Q", # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SLF", # flake8-self
  # "SLOT", # flake8-slots
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  # "TCH", # flake8-type-checking
  # "INT", # flake8-gettext
  # "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  # "TD", # flake8-todos
  # "FIX", # flake8-fixme
  "ERA", # eradicate
  # "PD", # pandas-vet
  # "PGH", # pygrep-hooks
  "PL", # Pylint
  # "TRY", # tryceratops
  # "FLY", # flynt
  # "NPY", # NumPy-specific rules
  # "AIR", # Airflow
  # "PERF", # Perflint
  # "FURB", # refurb
  # "LOG", # flake8-logging
  "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic values are fine in assertions
